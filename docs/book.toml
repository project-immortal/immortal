[book]
authors = ["Project Immortal Contributors"]
language = "en"
multilingual = false
src = "src"
title = "Project Immortal: Cleanroom Game Preservation & Server Emulation"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/project-immortal/immortal"
edit-url-template = "https://github.com/project-immortal/immortal/edit/main/docs/{path}"
site-url = "/immortal/"
default-theme = "rust"
preferred-dark-theme = "coal"
mathjax-support = false
