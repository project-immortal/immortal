[workspace]
resolver = "2"
members = [
    "crates/immortal-core",
    "crates/immortal-extract",
    "crates/immortal-net",
    "crates/immortal-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arafat Zahan <kuasha420>", "Project Immortal Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/project-immortal/immortal"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
byteorder = "1.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
